# Base44 development compose — runs the app from bind-mounted source
# with live-reload dev servers. No prebuilt app images.
services:
  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=ais
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      # Local infra + derived config only — never user-supplied secrets.
      - MONGO_URI=mongodb://mongo:27017/ais
      - PORT=5000
      - CORS_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env      # platform secrets — LAST, always wins
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:5000"
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  mongo-data:
